apiVersion: apps/v1
kind: Deployment
metadata:
  name: teamcity-server
  namespace: teamcity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teamcity-server
  template:
    metadata:
      labels:
        app: teamcity-server
    spec:
      containers:
      - name: teamcity-server
        image: docker.m.daocloud.io/jetbrains/teamcity-server:2025.07.3-linux
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8111
        volumeMounts:
        - name: teamcity-server-data
          mountPath: /data/teamcity_server/datadir
        - name: teamcity-logs
          mountPath: /opt/teamcity/logs
      volumes:
      - name: teamcity-server-data
        persistentVolumeClaim:
          claimName: teamcity-server-data
      - name: teamcity-logs
        emptyDir: {}
