apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-nfs-storage
provisioner: fuseim.pri/ifs # 外部制备器提供者, 该属性指定提供者名称
parameters:
  archiveOnDelete: "false"  # 是否存档. false 表示不存档, 会删除 oldPath 下的数据, true 表示存档, 会重命名路径
reclaimPolicy: Retain       # 回收策略. 默认为 Retain
volumeBindingMode: Immediate   # 默认模式 表示创建 PVC 立即进行绑定. 只有 azuredisk 和 AWSelastticblockstore 支持其他值
