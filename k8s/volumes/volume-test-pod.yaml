apiVersion: v1
kind: Pod
metadata: 
  name: test-pod
spec:
  containers:
  - image: nginx:1.17.9
    name: nginx-volume
    volumeMounts:
    - mountPath: /test-dir    # 挂载到容器的哪个目录下
      name: test-volume       # 挂载哪个数据卷
  volumes:
  - name: test-volume
    hostPath:           # 与主机共享目录
      path: /zey-test       # 要挂载的节点目录
      type: DirectoryOrCreate   # 挂载类型, 在挂载时对目录做什么检查. 默认为空字符串, 不做任何检查



